<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panamedia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #07070a;
        color: #ffffff;
        font-family: 'Outfit', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #07070a;
        background-image: radial-gradient(circle at 50% 40%, rgba(99, 102, 241, 0.18) 0%, rgba(7, 7, 10, 0.95) 70%);
        z-index: 999999;
        gap: 20px;
        user-select: none;
      }
      .app-reload-spinner {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        border: 3.5px solid rgba(255, 255, 255, 0.08);
        border-top-color: #6366f1;
        border-right-color: #a855f7;
        animation: app-spin 0.85s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        filter: drop-shadow(0 0 16px rgba(168, 85, 247, 0.45));
      }
      .app-reload-text {
        font-size: 13px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.75);
        letter-spacing: 0.8px;
        animation: app-pulse 1.8s ease-in-out infinite;
      }
      @keyframes app-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes app-pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="app-reload-spinner"></div>
        <div class="app-reload-text">Loading Panamedia...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
